name: Scout Scanner

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run scanner
        env:
          CASPIAN_API_KEY: ${{ secrets.CASPIAN_API_KEY }}
          CASPIAN_BASE_URL: ${{ secrets.CASPIAN_BASE_URL }}
          TELEGRAM_CONVERSATION_ID: ${{ secrets.TELEGRAM_CONVERSATION_ID }}
          DISCORD_CONVERSATION_ID: ${{ secrets.DISCORD_CONVERSATION_ID }}
        run: node scanner.js

      - name: Save seen.json back to the repo
        run: |
          git config user.name "Scout Bot"
          git config user.email "scout-bot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "Update seen.json [skip ci]"
          git push